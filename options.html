<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Momento</title>
  <style>
    :root {
      --bg: #FCFCFC; --raised: #FFFFFF; --border: #DFDFDF; --field: #E9E9E9; --field-hover: #E3E3E3;
      --text: #17232F; --secondary: #4D6073; --accent: #1069DA; --focus: #0462D3;
      --success: #166534; --danger: #B91C1C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1112; --raised: #1B1F23; --border: #202529; --field: #161A1D; --field-hover: #21262A;
        --text: #EEF1F5; --secondary: #A6AFB9; --focus: #5A98F3;
        --success: #88DDA9; --danger: #FF9B9B;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    header img { width: 40px; height: 40px; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .version { color: var(--secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
    section { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 4px 16px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
    .row > .label { flex: 1; font-weight: 500; }
    select, button { font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent;
      border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; }
    select:hover, button:hover { background: var(--field-hover); }
    select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    button:disabled { opacity: .5; cursor: default; }
    .status { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); }
    .ok .dot { background: var(--success); }
    .bad .dot { background: var(--danger); }
    .detail { color: var(--secondary); padding: 0 0 12px 16px; margin-top: -6px; }
    .detail:empty { display: none; }
    .error { color: var(--danger); padding: 0 0 12px; margin-top: -6px; }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-128.png" alt="">
      <div>
        <h1>Momento</h1>
        <div class="version"></div>
      </div>
    </header>
    <section>
      <div class="row">
        <label class="label" for="language" data-text="optionsLanguage"></label>
        <select id="language">
          <option value="auto" data-text="optionsLanguageAuto"></option>
          <option value="zh_CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <div class="error" id="language-error" role="alert"></div>
    </section>
    <section>
      <div class="row">
        <div class="status" id="status" role="status"><span class="dot"></span><span class="text"></span></div>
        <button id="recheck" data-text="optionsRecheck"></button>
      </div>
      <div class="detail" id="status-detail"></div>
    </section>
  </main>
  <script src="src/i18n.js"></script>
  <script src="src/options.js"></script>
</body>
</html>
